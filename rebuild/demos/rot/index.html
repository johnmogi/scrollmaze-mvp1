<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROT.js Micro Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #020617 100%);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main {
        width: min(900px, 100%);
        display: grid;
        gap: 1.5rem;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 1.5rem;
        padding: 2rem;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
      }
      h1 {
        font-size: 1.8rem;
        margin: 0;
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      section {
        border-radius: 1rem;
        padding: 1.25rem;
        background: rgba(248, 250, 252, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      section h2 {
        margin: 0 0 0.75rem;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #bae6fd;
      }
      dl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.75rem;
        margin: 0;
      }
      dt {
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      dd {
        margin: 0.1rem 0 0;
        font-size: 1rem;
        font-weight: 600;
        color: #f1f5f9;
      }
      pre {
        font-family: "Fira Code", "SFMono-Regular", Consolas, monospace;
        margin: 0;
        background: rgba(15, 23, 42, 0.65);
        border-radius: 0.8rem;
        padding: 1rem;
        overflow: auto;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      ul {
        margin: 0;
        padding-left: 1.2rem;
        color: #cbd5f5;
      }
      li {
        margin-bottom: 0.5rem;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(59, 130, 246, 0.18);
        color: #bfdbfe;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        border: 1px solid rgba(59, 130, 246, 0.35);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>ScrollMaze x ROT.js Micro Demo</h1>
      </header>

      <section id="hero"></section>
      <section id="monster"></section>
      <section id="board"></section>
      <section id="loot"></section>
      <section id="combat"></section>
      <section id="story"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/rot-js@2/dist/rot.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
